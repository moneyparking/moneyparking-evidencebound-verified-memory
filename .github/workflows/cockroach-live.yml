name: Cockroach Live Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}
      PGSSLROOTCERT: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test -n "$COCKROACH_DATABASE_URL"
      - run: python -m pip install -e .
      - run: python scripts/cockroach_acceptance.py
