name: CI

on:
  pull_request:
  push:
    branches: [main, "hackathon/**"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  cockroach-live:
    runs-on: ubuntu-latest
    env:
      COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify Cockroach secret presence
        shell: bash
        run: |
          if [ -z "$COCKROACH_DATABASE_URL" ]; then
            echo "COCKROACH_DATABASE_URL is missing" >&2
            exit 1
          fi
          echo "COCKROACH_DATABASE_URL_PRESENT=true"
      - name: Install CockroachDB Cloud CA
        shell: bash
        run: |
          mkdir -p "$HOME/.postgresql"
          curl --fail --silent --show-error --location \
            --output "$HOME/.postgresql/root.crt" \
            'https://cockroachlabs.cloud/clusters/517d4638-238e-4df0-9346-4522d1ddfe3e/cert'
          chmod 0600 "$HOME/.postgresql/root.crt"
          echo "COCKROACH_SSL_ROOT_CERT=$HOME/.postgresql/root.crt" >> "$GITHUB_ENV"
      - run: python -m pip install -e .
      - name: Real CockroachDB independent-session acceptance
        run: python scripts/live_acceptance.py
