name: CI

on:
  pull_request:
  push:
    branches: [main, "hackathon/**"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  cockroach-live:
    runs-on: ubuntu-latest
    if: ${{ secrets.COCKROACH_DATABASE_URL != '' }}
    env:
      COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Real CockroachDB independent-session acceptance
        run: python scripts/live_acceptance.py
