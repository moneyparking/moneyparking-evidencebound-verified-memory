[project]
name = "evidencebound-verified-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "mypy>=1.17,<2", "bandit>=1.8,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
