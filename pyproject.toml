[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencebound-verified-memory"
version = "0.1.0"
description = "Tamper-evident verified memory for proving and re-evaluating AI decisions"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
aws = ["boto3>=1.40,<2"]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
